name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v5

      - name: Установить uv
        uses: astral-sh/setup-uv@v7

      - name: Установить зависимости
        run: uv sync --frozen

      - name: Проверить код
        run: uv run ruff check .

      - name: Запустить тесты
        run: uv run pytest
        env:
          GREETING: "ci"
          DATABASE_URL: "postgresql://ci:ci@db:5432/ci"

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Скачать код
        uses: actions/checkout@v5

      - name: Настроить Docker
        uses: docker/setup-buildx-action@v4

      - name: Войти в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать и опубликовать образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Скачать код
        uses: actions/checkout@v5

      - name: Настроить Docker
        uses: docker/setup-buildx-action@v4

      - name: Войти в GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Собрать версионный образ
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}